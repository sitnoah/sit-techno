name: Validate SIT Technology
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check preview and shared assets
        run: |
          python3 scripts/build-preview.py
          python3 scripts/validate-preview.py
          node --check wordpress/themes/sit-technology/assets/site.js
          node --check wordpress/themes/sit-technology/assets/discovery.js
      - name: PHP syntax and input boundaries
        run: |
          php --version
          rg --files wordpress tests -g '*.php' -0 | xargs -0 -n1 php -l
          php tests/requests.php
          php tests/readiness.php
      - name: WordPress layout parity
        run: |
          curl --fail --location --retry 2 https://wordpress.org/wordpress-7.1.zip -o "$RUNNER_TEMP/sit-wordpress.zip"
          echo "d1ae02b5ae18428031ffc3943659fa87ab361d827f4aa804adf9276e4dc75df6  $RUNNER_TEMP/sit-wordpress.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sit-wordpress.zip" -d "$RUNNER_TEMP/sit-wordpress"
          SIT_WP_TEST_ROOT="$RUNNER_TEMP/sit-wordpress/wordpress" php tests/wordpress-rendering.php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Request and discovery interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/sit-validation" --no-save --ignore-scripts jsdom@30.0.1
          SIT_TEST_MODULES="$RUNNER_TEMP/sit-validation/node_modules" node tests/form.cjs
          SIT_TEST_MODULES="$RUNNER_TEMP/sit-validation/node_modules" node tests/discovery.cjs
          SIT_TEST_MODULES="$RUNNER_TEMP/sit-validation/node_modules" node tests/mobile-menu.cjs
